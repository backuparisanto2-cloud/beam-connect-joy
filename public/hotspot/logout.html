<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Logout &mdash; Kost Griya Arca Putri</title>
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="preload" href="style.css" as="style">
<link rel="stylesheet" href="style.css">
<script>try{var wh=Math.floor((((Date.now()/3600000)+7)%24+24)%24);var o=null;try{o=sessionStorage.getItem('griya-arca-theme');}catch(e){}var lt=o?(o==='light'):(wh>=6&&wh<18);if(lt)document.documentElement.setAttribute('data-theme','light');var cur=lt?'bg-morning3':'bg-night3',alt=lt?'bg-night3':'bg-morning3';var sfx=(Math.min(screen.width,screen.height)<=640&&(window.devicePixelRatio||1)<=1.5)?'-sm':'';cur+=sfx;alt+=sfx;var p=document.createElement('link');p.rel='preload';p.as='image';p.type='image/webp';p.setAttribute('fetchpriority','high');p.href='img/'+cur+'.webp';document.head.appendChild(p);var c=navigator.connection||{};var mob=Math.min(screen.width,screen.height)<=640||/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);if(!mob&&!c.saveData&&!/(^|-)2g$/.test(c.effectiveType||'')){var q=document.createElement('link');q.rel='prefetch';q.as='image';q.href='img/'+alt+'.webp';document.head.appendChild(q);}}catch(e){}</script>
</head>
<body class="nature2">
<button class="theme" id="themeBtn" type="button" aria-label="Ganti tema terang/gelap" onclick="toggleTheme()"></button>
<div class="wrap">
  <div class="brand"><span class="logo-img"><img class="for-light" src="img/logo-light.png" alt="Logo Kost Griya Arca Putri"><img class="for-dark" src="img/logo-dark.png" alt=""></span><div class="name">Hotspot Kost Griya Arca Putri</div></div>
  <div class="card">
    <p class="lead">Kamu sudah logout</p>
    <p class="sub">Terima kasih sudah memakai internet Kost Griya Arca Putri dengan bijak.</p>
    <div class="hr"></div>
    <div class="rows">
      <div><span>Lama terhubung</span><span>$(uptime)</span></div>
      <div><span>Data terpakai</span><span>$(bytes-in-nice) &darr; / $(bytes-out-nice) &uarr;</span></div>
    </div>
    <a class="btn" href="$(link-login)">Login Lagi</a>
    <div class="links"><a href="faq.html">FAQ & SOP Internet</a></div>
  </div>
</div>
<script src="theme.js"></script>
<script defer src="preload.js"></script>
</body>
</html>
